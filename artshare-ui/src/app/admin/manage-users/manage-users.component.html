<h1>Manage Users</h1>

<p *ngIf="isLoading">Loading users...</p>

<table *ngIf="!isLoading" class="user-table">
  <tr>
    <th>Email</th>
    <th>Role</th>
    <th>Actions</th>
  </tr>

  <tr *ngFor="let user of users">
    <td>{{ user.email }}</td>

    <td>
      <select [(ngModel)]="user.role">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
    </td>

    <td class="actions">
      <button (click)="updateRole(user)">Save</button>
      <button class="delete-btn" (click)="deleteUser(user)">Delete</button>
    </td>
  </tr>
</table>
