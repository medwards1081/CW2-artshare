<div class="signup-container">
  <mat-card class="signup-card">
    <mat-card-header>
      <mat-card-title>Create your ArtShare account</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">

        <!-- Email -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" required />
          <mat-error *ngIf="signupForm.get('email')?.invalid">
            Please enter a valid email
          </mat-error>
        </mat-form-field>

        <!-- Username (NEW FIELD) -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" type="text" required />
          <mat-error *ngIf="signupForm.get('username')?.invalid">
            Please enter a username
          </mat-error>
        </mat-form-field>

        <!-- Password -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password" required />
        </mat-form-field>

        <!-- Confirm Password -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirm Password</mat-label>
          <input matInput formControlName="confirmPassword" type="password" required />
        </mat-form-field>

        <!-- Date of Birth -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Date of Birth</mat-label>
          <input matInput formControlName="dob" type="date" required />
        </mat-form-field>

        <!-- Submit -->
        <button mat-raised-button color="primary" class="full-width">
          Sign Up
        </button>

      </form>
    </mat-card-content>

    <mat-card-actions>
      <a routerLink="/login" class="login-link">Already have an account? Log in</a>
    </mat-card-actions>
  </mat-card>
</div>
