<section class="hero">
  <h1>Welcome to ArtShare</h1>
  <p>Discover, upload, and share amazing artwork with the community.</p>
  <div class="cta-buttons">
    <button type="button" routerLink="/upload" routerLinkActive="active" class="primary-btn">
      Upload Your Artwork
    </button>
    <button type="button" routerLink="/admin" routerLinkActive="active" class="secondary-btn">
      Go to Admin Dashboard
    </button>
  </div>
</section>

<section class="artworks-grid">
  <h2>Featured Artworks</h2>
  <div class="grid">
    <div class="artwork-card">
      <img src="assets/sample1.jpg" alt="Artwork 1">
      <p>Artwork Title 1</p>
    </div>
    <div class="artwork-card">
      <img src="assets/sample2.jpg" alt="Artwork 2">
      <p>Artwork Title 2</p>
    </div>
    <div class="artwork-card">
      <img src="assets/sample3.jpg" alt="Artwork 3">
      <p>Artwork Title 3</p>
    </div>
    <div class="artwork-card">
      <img src="assets/sample4.jpg" alt="Artwork 4">
      <p>Artwork Title 4</p>
    </div>
  </div>
</section>
