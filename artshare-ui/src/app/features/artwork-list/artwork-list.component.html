<section class="hero">
  <h1>Welcome to ArtShare</h1>
  <p>Discover, upload, and share amazing artwork with the community.</p>
  <div class="cta-buttons">
    <a routerLink="/upload" routerLinkActive="active" class="primary-btn">
      Upload Your Artwork
    </a>
    <a routerLink="/admin" routerLinkActive="active" class="secondary-btn">
      Go to Admin Dashboard
    </a>
  </div>
</section>

<section class="artworks-grid">
  <h2>Featured Artworks</h2>
  <div class="masonry-grid">
    <!-- Loop through only the 6 displayed artworks with trackBy -->
    <div class="artwork-card"
         *ngFor="let artwork of displayedArtworks; let i = index; trackBy: trackByFn"
         [ngClass]="{ 'tall': i % 3 === 1, 'wide': i % 3 === 2 }">
      <img [src]="artwork.image" [alt]="artwork.title">
      <!-- Removed the <p> banner entirely -->
    </div>
  </div>
</section>


<section class="signup-section">
  <div class="signup-card">
    <h2>Join ArtShare Today</h2>
    <p class="signup-subtitle">
      Create your free account to upload, showcase, and connect with fellow artists.
    </p>
    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input id="dob" type="date" formControlName="dob" required>
      </div>
      <button type="submit" class="primary-btn">Sign Up</button>
      <p class="signup-footer">
        Already have an account? <a routerLink="/login">Log in here</a>
      </p>
    </form>
  </div>
</section>
