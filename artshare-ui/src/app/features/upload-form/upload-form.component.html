<div class="upload-container">
  <mat-card class="upload-card">
    <mat-card-header>
      <mat-card-title>Upload Media</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="uploadForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Title</mat-label>
          <input matInput formControlName="title" required />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" rows="3" required></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Category</mat-label>
          <mat-select formControlName="category">
            <mat-option value="art">Art</mat-option>
            <mat-option value="photography">Photography</mat-option>
            <mat-option value="video">Video</mat-option>
            <mat-option value="music">Music</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Tags</mat-label>
          <input matInput formControlName="tags" placeholder="Comma-separated tags" />
        </mat-form-field>

        <div class="file-input">
          <label for="fileUpload">Choose file</label>
          <input id="fileUpload" type="file" (change)="onFileSelected($event)" />
        </div>

        <button mat-raised-button color="primary" class="full-width">
          Upload
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
